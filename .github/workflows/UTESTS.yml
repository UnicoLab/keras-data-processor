name: "Unit-tests"

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "**.py"
      - "pyproject.toml"
      - "test/**"
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - edited
      - synchronize
    paths:
      - "**.py"
      - "pyproject.toml"
      - "test/**"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        required: false
        default: "3.11"
      TEST_TYPE:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - fast
          - unit
          - integration
          - smoke

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Fast smoke test job for quick feedback
  smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: Run smoke tests
        run: |
          poetry run pytest -m "micro" --maxfail=1 --tb=no -q --timeout=30
        timeout-minutes: 3

  # Main test matrix
  test-matrix:
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always() && (needs.smoke-test.result == 'success' || github.event_name != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test-group: ["unit", "integration", "layers"]
        include:
          - python-version: "3.11"
            test-group: "processor"
          - python-version: "3.11"
            test-group: "time-series"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run tests - ${{ matrix.test-group }}
        run: |
          case "${{ matrix.test-group }}" in
            "unit")
              poetry run pytest -c pytest-fast.ini -m "unit" --maxfail=10 --timeout=120
              ;;
            "integration")
              poetry run pytest -m "integration" --maxfail=3 --timeout=300
              ;;
            "layers")
              poetry run pytest -c pytest-fast.ini -m "layers" --maxfail=5 --timeout=120
              ;;
            "processor")
              poetry run pytest -c pytest-fast.ini -m "processor" --maxfail=3 --timeout=180
              ;;
            "time-series")
              poetry run pytest -c pytest-fast.ini -m "time_series" --maxfail=3 --timeout=180
              ;;
          esac
        timeout-minutes: 8

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.test-group }}
          path: |
            pytest.xml
            htmlcov/
          retention-days: 7

  # The package targets the Keras 3 API directly rather than the tf.keras shim,
  # so it must keep working with Keras releases newer than the one TensorFlow
  # happens to pin. This job catches a Keras 3 change before users do.
  keras-latest:
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always() && (needs.smoke-test.result == 'success' || github.event_name != 'pull_request')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with the newest Keras 3
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
          poetry run pip install --upgrade "keras>=3,<4"
          poetry run python -c "import keras; print('keras', keras.__version__)"

      - name: Run tests
        run: poetry run pytest -c pytest-fast.ini --timeout=180
        timeout-minutes: 15

  # The docs promise an API. This job runs every self-contained python example
  # in docs/ against data synthesised from the block's own feature spec, which
  # catches the defects a symbol check cannot: a wrong shape, an option
  # combination Keras rejects, or a method whose return value the prose
  # describes incorrectly.
  doc-examples:
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always() && (needs.smoke-test.result == 'success' || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run every documented example
        run: poetry run python scripts/verify_doc_examples.py
        timeout-minutes: 25

  # Coverage job (only on main Python version)
  coverage:
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always() && needs.test-matrix.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run tests with coverage
        run: |
          poetry run pytest -c pytest-fast.ini --cov=kdp --cov-report=xml --cov-report=html --timeout=180
        timeout-minutes: 10

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # Performance benchmark job (optional)
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Run benchmarks
        run: |
          poetry run pytest -m "performance" --benchmark-only --benchmark-json=benchmark.json || true
        timeout-minutes: 10

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30
