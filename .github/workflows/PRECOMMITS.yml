name: Pre-commit checks
on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - edited
      - synchronize
  workflow_dispatch:
    branches:
      - dev
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  pre-commit-checks:
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Kept in step with the local commit-msg hook in .pre-commit-config.yaml.
      # Checking it here rather than through a third-party action keeps the two
      # definitions in one repository and removes an unpinned dependency.
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(break|build|ci|docs|feat|fix|perf|refactor|style|test|ops|hotfix|release|maint|init|enh|revert)\([^)]+\)!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::Pull request title does not follow the conventional-commit format."
            echo "Got:      $PR_TITLE"
            echo "Expected: type(scope): description"
            echo "Types:    break, build, ci, docs, feat, fix, perf, refactor, style,"
            echo "          test, ops, hotfix, release, maint, init, enh, revert"
            exit 1
          fi
          echo "Pull request title is valid."

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # `--all-files` rather than a changed-files list: the repository is clean
      # under every hook, so this is both simpler and stricter, and it drops the
      # unpinned third-party action the changed-files plumbing needed.
      - name: Pre-commit checks
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "pre-commit>=3.6,<4"
          pre-commit run --all-files --show-diff-on-failure
